# Levanta las dos bases de datos del proyecto.
# Los valores salen del archivo .env (copiar .env.example a .env).
# Los scripts de db/postgres y db/mongo se ejecutan solos la PRIMERA vez que se crea cada volumen.
services:
  postgres:
    image: postgres:17
    container_name: cineconecta-postgres
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      PG_APP_USER: ${PG_APP_USER}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
      PG_REPORT_USER: ${PG_REPORT_USER}
      PG_REPORT_PASSWORD: ${PG_REPORT_PASSWORD}
      TZ: UTC
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:8
    container_name: cineconecta-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodata:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
  mongodata:
